# Netlify configuration for the client-side demo.
# Plain static files: no build step, publish the repository root.

[build]
  publish = "."

# Vendor libraries are versioned in the repo; cache them aggressively.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
